[project]
name = "veilbreakers-terrain"
version = "0.1.0"
description = "Terrain/environment/water/biome generation for VeilBreakers gamedev toolkit."
requires-python = ">=3.11"
authors = [{name = "VeilBreakers gamedev"}]
readme = "README.md"
dependencies = [
    "numpy>=1.26.0",
    "opensimplex>=0.4.5",
]

[project.optional-dependencies]
dev = [
    "Pillow>=10.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pre-commit>=4.0",
    "ruff>=0.8.0",
]
mcp = [
    "veilbreakers-mcp @ git+https://github.com/Sharks820/veilbreakers-gamedev-toolkit.git@1516c802c487c74a0f4e4aec42d8e42930d75e24#subdirectory=Tools/mcp-toolkit ; python_version >= '3.12'",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["veilbreakers_terrain/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --durations=20 --maxfail=50 --tb=short"
timeout = 120
markers = [
    "benchmark: performance and wall-clock regression checks",
    "contract: exported data contract tests",
    "integration: cross-module integration tests",
    "slow: long-running tests",
    "visual: render or image-diff quality gates",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veilbreakers_terrain"]
