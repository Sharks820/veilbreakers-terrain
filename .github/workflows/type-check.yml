name: Type Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pyright
        run: pip install pyright==1.1.408

      - name: Run pyright type check
        run: pyright -p pyrightconfig.json

  pyright-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pyright
        run: pip install pyright==1.1.408

      - name: Run pyright strict ratchet lane
        run: python scripts/pyright_strict_baseline_gate.py
