name: Type Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  pyright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install veilbreakers-mcp from source
        run: |
          pip install "git+https://github.com/Sharks820/veilbreakers-gamedev-toolkit.git#subdirectory=Tools/mcp-toolkit"

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Install pyright
        run: pip install pyright

      - name: Run pyright type check
        run: pyright veilbreakers_terrain --pythonversion 3.11
