name: Type Check

# T0-6 (Y04 v2-ord 3 / FIX_PATTERN_v1 §C1): minimal-privilege default.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.11
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pyright
        run: pip install pyright==1.1.408

      - name: Run pyright type check
        run: pyright -p pyrightconfig.json

  pyright-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.11
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pyright
        run: pip install pyright==1.1.408

      - name: Run pyright strict ratchet lane
        run: python scripts/pyright_strict_baseline_gate.py
