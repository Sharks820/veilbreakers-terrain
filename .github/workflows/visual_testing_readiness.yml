name: Visual Testing Readiness Gate

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  visual-testing-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          BLENDER_PYDEPS="$RUNNER_TEMP/blender_pydeps"
          mkdir -p "$BLENDER_PYDEPS"
          BLENDER_PYDEPS="$BLENDER_PYDEPS" blender --background --python-expr "import ensurepip, os; ensurepip.bootstrap(); import pip._internal; raise SystemExit(pip._internal.main(['install', '--upgrade', '--target', os.environ['BLENDER_PYDEPS'], 'numpy', 'opensimplex', 'pillow']))"

      - name: Run visual testing readiness gate
        id: visual_gate
        run: |
          PYTHONPATH="$RUNNER_TEMP/blender_pydeps:$PWD:${PYTHONPATH:-}" blender --background --python scripts/visual_testing_readiness_gate.py

      - name: Upload readiness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-testing-readiness
          path: |
            output/visual_readiness/VISUAL_TESTING_READINESS.json
            output/visual_readiness/VISUAL_TESTING_READINESS.md
            output/visual_readiness/test_live_preview_thumbnail.png
          if-no-files-found: warn

      # Strict plumbing enforcement: fail CI when the gate detects a placeholder
      # PNG or a pixel-diff exceedance, regardless of the allow-no-blender flag.
      - name: Enforce artifact shape
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path("output/visual_readiness/VISUAL_TESTING_READINESS.json")
          if not p.exists():
              print("readiness JSON missing")
              sys.exit(1)
          data = json.loads(p.read_text(encoding="utf-8"))
          required_keys = {
              "ready_for_visual_testing",
              "blockers",
              "blender_runtime_detected",
              "placeholder_png",
              "blank_png",
              "image_stats",
              "blender_fixture",
              "pixel_diff_exceeded",
              "perceptual_hash",
              "captured_byte_length",
              "requested_screenshot_shape",
              "reference_present",
              "pixel_diff",
          }
          missing = sorted(required_keys - data.keys())
          if missing:
              print(f"artifact missing keys: {missing}")
              sys.exit(1)
          if data.get("placeholder_png"):
              print("FAIL: placeholder_png=true")
              sys.exit(1)
          if data.get("blank_png"):
              print("FAIL: blank_png=true")
              sys.exit(1)
          if not data.get("blender_runtime_detected"):
              print("FAIL: blender_runtime_detected=false")
              sys.exit(1)
          if not data.get("blender_fixture", {}).get("created"):
              print("FAIL: blender fixture was not created")
              sys.exit(1)
          if data.get("pixel_diff_exceeded"):
              print("FAIL: pixel_diff_exceeded=true")
              sys.exit(1)
          if not data.get("reference_present"):
              print("FAIL: reference_present=false")
              sys.exit(1)
          if not data.get("pixel_diff", {}).get("compared"):
              print("FAIL: pixel_diff.compared=false")
              sys.exit(1)
          print("artifact shape OK; blender_runtime_detected=",
                data.get("blender_runtime_detected"))
          PY
