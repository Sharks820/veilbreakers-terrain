name: Callable Census Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  callable-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true
      - name: Run callable census gate
        run: |
          python scripts/callable_census_gate.py --strict-zero
          python scripts/scan_callable_wiring.py --strict-no-risk
          python scripts/check_protocol_adoption.py
