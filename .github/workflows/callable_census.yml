name: Callable Census Gate

# T0-6 (Y04 v2-ord 3 / FIX_PATTERN_v1 §C1): minimal-privilege default.
# Supply-chain hardening per Xbox GDK XR-064.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  callable-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run callable census gate
        run: |
          python scripts/callable_census_gate.py --strict-zero
          python scripts/scan_callable_wiring.py --strict-no-risk
          python scripts/check_protocol_adoption.py
