name: Python Package

# T0-6 (Y04 v2-ord 3 / FIX_PATTERN_v1 §C1): minimal-privilege default.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # T4-NEW-ZZ4-06 (per MASTER_FINAL §P.1.2 F7 / Y04 v3 §P.8.5): lfs:true
      # so checkout materialises real binaries from LFS instead of leaving
      # them as 130-byte pointer text. Without this, tests depending on
      # LFS fixtures (PNG goldens, .npz baselines, .blend files) silently
      # see pointer-text content and pass against false-signal data.
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -e ".[mcp]"
          fi

      - name: Lint with Ruff (runtime errors + guardrails)
        run: |
          python -m ruff check --select F821 veilbreakers_terrain/handlers
          python -m ruff check \
            scripts/callable_census_gate.py \
            scripts/scan_callable_wiring.py \
            scripts/build_test_guardrail_audit.py \
            scripts/build_verification_matrix.py \
            scripts/build_industry_best_practice_callable_matrix.py \
            scripts/build_master_callable_audit.py \
            scripts/check_protocol_adoption.py \
            scripts/terrain_best_practice_guardrail.py \
            veilbreakers_terrain/handlers/_water_network.py \
            veilbreakers_terrain/handlers/environment.py \
            veilbreakers_terrain/handlers/terrain_erosion_filter.py \
            veilbreakers_terrain/handlers/terrain_materials.py \
            veilbreakers_terrain/handlers/terrain_protocol.py \
            veilbreakers_terrain/handlers/terrain_quixel_ingest.py \
            veilbreakers_terrain/handlers/terrain_twelve_step.py \
            veilbreakers_terrain/handlers/terrain_unity_export.py \
            veilbreakers_terrain/handlers/vegetation_system.py \
            veilbreakers_terrain/tests/test_environment_handlers.py \
            veilbreakers_terrain/tests/test_seam_boundary_np_pad.py \
            veilbreakers_terrain/tests/test_terrain_erosion_filter.py \
            veilbreakers_terrain/tests/test_terrain_material_ceiling.py \
            veilbreakers_terrain/tests/test_protocol_dag_quality_hardening.py \
            veilbreakers_terrain/tests/test_terrain_scatter_altitude_audit_linter.py \
            veilbreakers_terrain/tests/test_terrain_unity_export_bridge.py \
            veilbreakers_terrain/tests/test_visual_qa_golden.py

      - name: Terrain quality guardrails
        run: |
          python -m veilbreakers_terrain.handlers.terrain_scatter_altitude_audit_linter
          python scripts/callable_census_gate.py --strict-zero
          python scripts/scan_callable_wiring.py --strict-no-risk
          python scripts/check_protocol_adoption.py
          python scripts/build_test_guardrail_audit.py --strict-quality
          python scripts/build_verification_matrix.py
          python scripts/build_industry_best_practice_callable_matrix.py
          python scripts/terrain_best_practice_guardrail.py --strict-grade-status --strict-verification

      - name: Test with pytest + coverage
        env:
          TERRAIN_STRICT_PROVENANCE: "1"
        run: |
          python -m pytest \
            --cov=veilbreakers_terrain \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=72 \
            -q

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: warn

  # T0-6 (Y04 v2-ord 3 / FIX_PATTERN_v1 §C1): pip-audit gate to detect
  # known-vulnerable wheels in the resolved dep tree before merge. ``--strict``
  # fails on any advisory. Cert-blocking per Xbox GDK XR-064.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install project + pip-audit
        # T0-6 round-3 (CI red on round-2): pip-audit --requirement expects
        # a requirements.txt-format file (one PEP-440 spec per line), not
        # pyproject.toml's TOML [project] section. Round-2 used --requirement
        # pyproject.toml which fails immediately with "Invalid requirement".
        # Round-3: install the project (which resolves its declared deps),
        # then audit the installed environment via pip-audit --strict
        # without --requirement. This audits the exact dep tree CI will run.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
      - name: Run pip-audit
        # --strict: fails on any advisory (cert-blocking per Xbox GDK XR-064).
        # --skip-editable: skips veilbreakers-terrain itself (the project being
        # audited is installed editable; pip-audit would try to look it up on
        # PyPI and fail with "Dependency not found on PyPI"). This excludes
        # ONLY editable installs (i.e., the project itself); all 3rd-party
        # deps from pyproject.toml remain audited.
        # No --requirement flag: pip-audit defaults to auditing the installed
        # environment from the previous step. The fallback masking concern
        # from SEC-PR95-02 (round-1) is fully resolved because there is only
        # one audit path now.
        run: pip-audit --strict --skip-editable

  # T0-6 round-2: pre-commit-on-CI deferred to a follow-up PR.
  # CE deployment verification (NO-GO finding on first attempt) confirmed
  # that the existing .pre-commit-config.yaml has hooks that REGENERATE
  # tracked binary fixtures (output/test_artifacts/**/*.npz +
  # output/water_test/*.png). The first CI run with pre-commit/action@v3.0.1
  # detected this drift correctly and failed — i.e. pre-commit was working,
  # but the underlying hook hygiene is a separate project-level cleanup task.
  # Restoring the pre-commit job here without first either (a) gitignoring
  # the regenerated artifacts or (b) excluding them from the offending
  # hooks would block every PR's CI on a known-pre-existing drift.
  # Tracking issue: file as T0-6b in next session.
