name: Python Package

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install veilbreakers-mcp from source
        run: |
          pip install "git+https://github.com/Sharks820/veilbreakers-gamedev-toolkit.git#subdirectory=Tools/mcp-toolkit"

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Lint with Ruff (errors + warnings)
        run: python -m ruff check .

      - name: Test with pytest + coverage
        run: |
          python -m pytest \
            --cov=veilbreakers_terrain \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -q

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: warn
