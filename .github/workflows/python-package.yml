name: Python Package

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -e ".[mcp]"
          fi

      - name: Lint with Ruff (runtime errors + guardrails)
        run: |
          python -m ruff check --select F821 veilbreakers_terrain/handlers
          python -m ruff check \
            scripts/callable_census_gate.py \
            scripts/scan_callable_wiring.py \
            scripts/build_test_guardrail_audit.py \
            scripts/build_verification_matrix.py \
            scripts/build_industry_best_practice_callable_matrix.py \
            scripts/build_master_callable_audit.py \
            scripts/check_protocol_adoption.py \
            scripts/terrain_best_practice_guardrail.py \
            veilbreakers_terrain/handlers/_water_network.py \
            veilbreakers_terrain/handlers/environment.py \
            veilbreakers_terrain/handlers/terrain_erosion_filter.py \
            veilbreakers_terrain/handlers/terrain_materials.py \
            veilbreakers_terrain/handlers/terrain_protocol.py \
            veilbreakers_terrain/handlers/terrain_quixel_ingest.py \
            veilbreakers_terrain/handlers/terrain_twelve_step.py \
            veilbreakers_terrain/handlers/terrain_unity_export.py \
            veilbreakers_terrain/handlers/vegetation_system.py \
            veilbreakers_terrain/tests/test_environment_handlers.py \
            veilbreakers_terrain/tests/test_seam_boundary_np_pad.py \
            veilbreakers_terrain/tests/test_terrain_erosion_filter.py \
            veilbreakers_terrain/tests/test_terrain_material_ceiling.py \
            veilbreakers_terrain/tests/test_protocol_dag_quality_hardening.py \
            veilbreakers_terrain/tests/test_terrain_scatter_altitude_audit_linter.py \
            veilbreakers_terrain/tests/test_terrain_unity_export_bridge.py \
            veilbreakers_terrain/tests/test_visual_qa_golden.py

      - name: Terrain quality guardrails
        run: |
          python -m veilbreakers_terrain.handlers.terrain_scatter_altitude_audit_linter
          python scripts/callable_census_gate.py --strict-zero
          python scripts/scan_callable_wiring.py --strict-no-risk
          python scripts/check_protocol_adoption.py
          python scripts/build_test_guardrail_audit.py --strict-quality
          python scripts/build_verification_matrix.py
          python scripts/build_industry_best_practice_callable_matrix.py
          python scripts/terrain_best_practice_guardrail.py --strict-grade-status --strict-verification

      - name: Test with pytest + coverage
        env:
          TERRAIN_STRICT_PROVENANCE: "1"
        run: |
          python -m pytest \
            --cov=veilbreakers_terrain \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=72 \
            -q

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: warn
