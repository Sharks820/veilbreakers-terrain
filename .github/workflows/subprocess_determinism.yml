# GATE D25 — subprocess-determinism CI matrix.
#
# Closes Phase B by validating that the deterministic terrain bake is
# byte-identical across:
#
#   * 3 operating systems   (ubuntu-latest, macos-latest, windows-latest)
#   * 3 Python versions     (3.11, 3.12, 3.13)
#   * 2 master seeds        (42, 7777)
#
# = 18 individual matrix cells.  A separate ``summary`` job downstream
# requires ALL 18 cells green and publishes the canonical check name
# ``subprocess-determinism (18/18)`` that branch protection consumes.
#
# Why subprocess?
# ---------------
# In-process determinism CI is theatre (per ``feedback_audit_strictness.md``)
# because module-level globals, numpy default RNG state, and PYTHONHASHSEED
# only get freshly reseeded on a NEW interpreter start.  Each cell here
# spawns ``runs=2`` independent subprocesses inside the harness so any
# bake-time non-determinism surfaces as a hash mismatch.

name: subprocess-determinism

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

# Permissions: read-only — this workflow does not write artefacts back to
# the repo.  CodeQL and other static analyses ignore this file.
# ``pull-requests: read`` is needed by the docs-only detection job so it
# can list the files changed in the PR via the GitHub API.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Hardening PR B Fix #12 (VC finding) revised per Codex review:
  # Detect docs-only changes INSIDE a job rather than via a top-level
  # ``paths-ignore`` filter.  GitHub keeps the workflow Pending forever
  # when ``paths-ignore`` skips it entirely, which would make docs-only
  # PRs unmergeable because the required ``subprocess-determinism (18/18)``
  # check is documented in this same file.  Instead we:
  #
  #   1. Always trigger the workflow.
  #   2. Run a lightweight ``detect-docs-only`` job that flips an output
  #      flag when EVERY changed path matches docs/**, *.md, or .planning/**.
  #   3. Gate the expensive 18-cell matrix on that flag.
  #   4. Still publish ``subprocess-determinism (18/18)`` from the summary
  #      job — it short-circuits to PASS for docs-only PRs because there
  #      is no source-side determinism risk to validate.
  detect-docs-only:
    name: detect-docs-only
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Detect docs-only change set
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Collect changed files for the event.  ``pull_request`` uses the
          # GitHub API (handles forks + cross-branch diffs); ``push`` falls
          # back to ``git diff`` between before/after SHAs.  When neither
          # surfaces a useful list we conservatively assume NOT docs-only
          # (i.e. run the full matrix) so we never silently skip safety work.
          if [ -n "${PR_NUMBER:-}" ]; then
            files="$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' || true)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA:-}" != "0000000000000000000000000000000000000000" ]; then
            files="$(git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}" || true)"
          else
            files=""
          fi
          if [ -z "$files" ]; then
            echo "Could not enumerate changed files — running full matrix."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              docs/*|*.md|.planning/*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Detected docs_only=$docs_only across $(printf '%s\n' "$files" | wc -l) changed paths."

  cell:
    name: cell (${{ matrix.os }} / py${{ matrix.python-version }} / seed=${{ matrix.seed-seq }}${{ matrix.randomized_hashseed && ' / randomized_hashseed' || '' }}${{ matrix.strict_provenance && ' / strict_provenance' || '' }})
    needs: detect-docs-only
    if: ${{ needs.detect-docs-only.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # fail-fast=false so we see ALL cell failures, not just the first.
      # GATE D25 requires 18/18 fixed-seed cells — partial green is not
      # acceptable.  The randomized-hashseed cell (#19) is observability-
      # only: it is not blocking, but a divergence there reveals dict /
      # set iteration leaks the fixed-seed lanes can't see.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        seed-seq: [42, 7777]
        randomized_hashseed: [false]
        # 19th cell: explicitly leaves PYTHONHASHSEED unset so each child
        # interpreter draws a fresh random hash seed.  This catches
        # PYTHONHASHSEED-class non-determinism (set/dict iteration order
        # leaking into output bytes) that the fixed-seed=0 lanes mask by
        # construction (Codex P2 finding on PR #46, thread 1).  This cell
        # is informational — it does NOT contribute to the 18/18 summary
        # check below.  See ``summary`` job comments for why.
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            seed-seq: 42
            randomized_hashseed: true
            strict_provenance: false
          # Hardening PR B Fix #12 (VC finding): 20th observability cell
          # with TERRAIN_STRICT_PROVENANCE=1 to surface provenance-channel
          # corruption that the standard 18 cells silently tolerate.  Like
          # the 19th randomized-hashseed cell, this is non-blocking — a
          # divergence here produces a follow-up issue, not a merge block.
          - os: ubuntu-latest
            python-version: "3.12"
            seed-seq: 42
            randomized_hashseed: false
            strict_provenance: true

    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python ${{ matrix.python-version }}
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (no dev extras — keep CI surface narrow)
        # We only need the runtime package + numpy to invoke the harness.
        # Skipping ``[dev]`` shaves ~30s per cell × 18 cells = ~9 min.
        # Hardening PR B Fix #12 (VC finding): wrap pip install in a
        # retry-on-flake loop so transient PyPI 503s / connection resets
        # (common on 18 simultaneous matrix cells) don't cascade to a
        # false GATE D25 failure.  2 retries with exponential backoff is
        # the same shape as nick-fields/retry@v3 default config.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install -e .; then
              echo "pip install -e . succeeded on attempt $attempt"
              exit 0
            fi
            echo "pip install -e . failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::pip install -e . failed after 3 attempts"
          exit 1

      - name: Run subprocess-determinism harness (fixed PYTHONHASHSEED=0)
        # The harness exits 0 only when both subprocess bakes produce
        # byte-identical SHA-256 hashes.  Exit 1 on divergence, exit 2
        # on configuration error.
        # ``shell: bash`` is REQUIRED because windows-latest defaults to
        # PowerShell which mis-parses backslash line continuations as
        # unary operators (``Missing expression after unary operator '--'``).
        if: ${{ !matrix.randomized_hashseed && !matrix.strict_provenance }}
        env:
          # Pin PYTHONHASHSEED to 0 so the bake is reproducible across runs.
          # The harness itself spawns fresh subprocesses inside this env so
          # both child interpreters inherit the same hash seed.  This is
          # the 18-cell GATE D25 lane.
          PYTHONHASHSEED: "0"
        shell: bash
        run: |
          python -m veilbreakers_terrain.deterministic_bake_harness \
            --seed=${{ matrix.seed-seq }} \
            --tile=0,0 \
            --runs=2 \
            --size=32

      - name: Run subprocess-determinism harness (strict-provenance — observability)
        # Hardening PR B Fix #12 (VC finding): 20th observability cell.
        # Sets TERRAIN_STRICT_PROVENANCE=1 to surface provenance-channel
        # corruption that the standard 18 fixed-seed cells silently
        # tolerate.  Non-blocking via ``continue-on-error`` so a strict-
        # provenance divergence is logged but does not fail the
        # ``subprocess-determinism (18/18)`` summary gate.  When this lane
        # goes red we file a follow-up issue rather than block merges.
        if: ${{ matrix.strict_provenance }}
        env:
          PYTHONHASHSEED: "0"
          TERRAIN_STRICT_PROVENANCE: "1"
        continue-on-error: true
        shell: bash
        run: |
          python -m veilbreakers_terrain.deterministic_bake_harness \
            --seed=${{ matrix.seed-seq }} \
            --tile=0,0 \
            --runs=2 \
            --size=32

      - name: Run subprocess-determinism harness (randomized hash seed — observability)
        # 19th cell variant: explicitly leaves PYTHONHASHSEED **unset** so
        # each child interpreter draws a fresh random hash seed at startup.
        # This is the lane that can detect PYTHONHASHSEED-class
        # non-determinism (set/dict iteration order leaking into output
        # bytes) — the fixed-seed=0 lanes mask that class by construction.
        # NOTE: this step is non-blocking via ``continue-on-error`` so a
        # randomized divergence is logged but does not fail the
        # ``subprocess-determinism (18/18)`` summary gate.  Branch
        # protection still requires the 18 fixed-seed cells.  When the
        # randomized lane goes red we file an issue rather than block
        # merges, since the fix is usually structural (replace
        # ``frozenset`` iteration with ``sorted(...)`` etc.) and lands in
        # a follow-up PR.
        if: ${{ matrix.randomized_hashseed }}
        # NOTE: no PYTHONHASHSEED env entry here — we want each subprocess
        # to draw its own random seed at interpreter start.
        continue-on-error: true
        shell: bash
        run: |
          python -m veilbreakers_terrain.deterministic_bake_harness \
            --seed=${{ matrix.seed-seq }} \
            --tile=0,0 \
            --runs=2 \
            --size=32

  # GATE D25 published check — requires ALL 18 fixed-seed cells green.
  # Branch protection consumes ``subprocess-determinism (18/18)`` as the
  # single required status (configured in
  # IMPLEMENTATION_FIX_GUIDE_2026_05_07_FINAL §8.2).  We use
  # ``needs: cell`` + ``if: always()`` so this job runs even when
  # individual cells fail, and inspects the final result manually.
  #
  # The 19th randomized-hashseed cell uses ``continue-on-error: true`` at
  # the step level, so a divergence there does NOT mark the matrix cell
  # as failed (the cell still reports success even though the inner
  # harness exited non-zero).  ``needs.cell.result == "success"``
  # therefore reflects only the 18 fixed-seed lanes — exactly what GATE
  # D25 requires.  Track randomized-lane divergences via the per-step
  # logs in that cell, not via the summary check.
  summary:
    name: subprocess-determinism (18/18)
    runs-on: ubuntu-latest
    needs: [detect-docs-only, cell]
    # ``always()`` so this job still runs (and publishes the required
    # check) even when the matrix is skipped (docs-only PR) or some
    # cells fail — we inspect ``needs`` results manually below.
    if: always()
    steps:
      - name: Assert all 18 fixed-seed cells succeeded
        # ``needs.cell.result`` aggregates the matrix outcome.  When ANY
        # cell fails, ``result`` is "failure"; "success" only when all
        # cells passed.  GATE D25 fails the summary check if not 18/18.
        #
        # Docs-only short-circuit: when ``detect-docs-only`` reports
        # ``docs_only=true`` the matrix is intentionally skipped (Codex
        # review fix on Hardening PR B), so ``needs.cell.result`` will be
        # ``skipped``.  We treat that as a PASS for the required check
        # because no source-side determinism risk exists for docs-only
        # changes.  The subprocess-determinism matrix runs again on the
        # next non-docs PR that touches source.
        shell: bash
        run: |
          docs_only="${{ needs.detect-docs-only.outputs.docs_only }}"
          cell_result="${{ needs.cell.result }}"
          echo "detect-docs-only.docs_only=$docs_only"
          echo "cell.result=$cell_result"
          if [ "$docs_only" = "true" ]; then
            if [ "$cell_result" = "skipped" ]; then
              echo "GATE D25 SHORT-CIRCUIT PASS — docs-only PR; matrix correctly skipped."
              exit 0
            fi
            echo "::error::detect-docs-only reported docs_only=true but matrix did not skip (cell_result=$cell_result) — workflow logic broken."
            exit 1
          fi
          if [ "$cell_result" != "success" ]; then
            echo "::error::GATE D25 failed — subprocess-determinism matrix did not reach 18/18 (result: $cell_result)"
            exit 1
          fi
          echo "GATE D25 PASSED — 18/18 subprocess-determinism cells green."
